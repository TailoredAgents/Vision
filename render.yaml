databases:
  - name: vision-commercial-db
    databaseName: vision_commercial
    user: vision_app
    plan: 0.1c-256mb
    region: virginia

services:
  - type: web
    name: vision-commercial-advisors
    runtime: node
    plan: 0.5c-512mb
    region: virginia
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: vision-commercial-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: RATE_LIMIT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_PREVIEW_MODE
        value: "true"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_SETUP_TOKEN
        sync: false
